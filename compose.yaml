services:
  knowledge-builder:
    build: .
    command: ["/opt/knowledge/bin/python", "-u", "scripts/knowledge/catalogue.py", "--watch"]
    mem_limit: 1g
    restart: unless-stopped
    volumes:
      - quiz_data:/app/storage
  app:
    mem_limit: 4g
    build: .
    restart: unless-stopped
    environment:
      HOST_PASSWORD: ${HOST_PASSWORD?Set HOST_PASSWORD in .env}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      KNOWLEDGE_MODEL_URL: ${KNOWLEDGE_MODEL_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      KNOWLEDGE_WORLD_DB: /app/storage/world/wikidata5m-v1.sqlite
      QUIZ_SEMANTIC: ${QUIZ_SEMANTIC:-on}
      FRONTEND_URL: ${FRONTEND_URL:-}
      TRUST_PROXY: "1"
    volumes:
      - quiz_data:/app/storage
      - quiz_backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  quiz_data:
  quiz_backups:
  caddy_data:
  caddy_config:
