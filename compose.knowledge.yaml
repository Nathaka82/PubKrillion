services:
  app:
    environment:
      KNOWLEDGE_MODEL_URL: http://knowledge-model:11434
    networks:
      knowledge:
      default:
  knowledge-model:
    image: ollama/ollama:0.40.18
    mem_limit: 3500m
    cpus: 2
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - knowledge_model:/root/.ollama
    networks:
      - knowledge
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        /bin/ollama serve &
        pid=$$!
        trap 'kill "$$pid"' TERM INT
        until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
        /bin/ollama pull qwen2.5:1.5b
        wait "$$pid"
networks:
  knowledge:
volumes:
  knowledge_model:
