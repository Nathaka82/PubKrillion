name: Deploy quiz to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krillion-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Rehearse upgrade and rollback behind shared HTTPS
        run: bash tests/vps-deploy.sh

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://krillion.duckdns.org
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Install release
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_USER: ${{ vars.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ && -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$SSH_KEY" > "$work/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$work/known_hosts"
          ssh_cmd=(ssh -F /dev/null -i "$work/key" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o "UserKnownHostsFile=$work/known_hosts" "$VPS_USER@$VPS_HOST")
          release="/opt/krillion/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$work/bundle"
          cp compose.vps.yaml scripts/deploy-vps.sh "$work/bundle/"
          printf 'KRILL_IMAGE=%s\nKRILL_REVISION=%s\n' "$IMAGE" "$GITHUB_SHA" > "$work/bundle/release.env"
          tar -C "$work/bundle" -czf - . | "${ssh_cmd[@]}" "set -eu; umask 077; mkdir '$release'; tar -C '$release' -xzf -"
          # The registry credential lives only for this pull.
          printf '%s' "$GHCR_TOKEN" | "${ssh_cmd[@]}" "set -eu; export DOCKER_CONFIG=\$(mktemp -d); trap 'rm -rf -- \"\$DOCKER_CONFIG\"' EXIT; docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin; docker pull '$IMAGE'"
          "${ssh_cmd[@]}" "bash '$release/deploy-vps.sh' deploy"
